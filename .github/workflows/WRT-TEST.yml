# 单 profile 调试：只输出 .config，不编译固件。
# 支持选择已知源（chasey / padavanonly）或自定义源。
name: WRT-TEST

on:
  # 手动编译
  workflow_dispatch:
    inputs:
      PROFILE:
        description: '上游 defconfig 的 profile 名（如 mt7981-ax3000）'
        default: 'mt7981-ax3000'
        required: true
        type: string
      SOURCE:
        description: '已知源 key 或 custom'
        default: 'padavanonly'
        required: true
        type: choice
        options:
         - padavanonly
         - chasey
         - custom
      REPO:
        description: 'custom 时填写 owner/repo'
        default: ''
        required: false
        type: string
      BRANCH:
        description: 'custom 时填写分支'
        default: ''
        required: false
        type: string
      PACKAGE:
        required: false
        type: string
      TEST:
        description: '仅输出配置文件，不编译固件。'
        default: true
        required: true
        type: boolean

# CI权限
permissions: write-all

# CI任务
jobs:
  config:
    name: ${{inputs.SOURCE}}/${{inputs.PROFILE}}
    # 调用公用编译核心 WRT-CORE.yml
    uses: ./.github/workflows/WRT-CORE.yml
    with:
      # 上游 defconfig 的 profile 名
      WRT_CONFIG: ${{inputs.PROFILE}}
      # 覆盖层名（custom 用 _default）
      WRT_OVERLAY: ${{ inputs.SOURCE == 'custom' && '_default' || inputs.SOURCE }}
      # 默认主题
      WRT_THEME: aurora
      # 默认主机名
      WRT_NAME: CWRT
      # 默认WIFI名称
      WRT_SSID: CWRT
      # 默认WIFI密码
      WRT_WORD: 12345678
      # 默认地址
      WRT_IP: 192.168.10.1
      # 默认密码，仅作提示，修改无用
      WRT_PW: 无
      # 源码链接
      WRT_REPO: https://github.com/${{ inputs.SOURCE == 'custom' && inputs.REPO || inputs.SOURCE }}.git
      # 源码分支
      WRT_BRANCH: ${{ inputs.SOURCE == 'custom' && inputs.BRANCH || (inputs.SOURCE == 'chasey' && '25.12' || 'openwrt-24.10-6.6') }}
      # 源码名称
      WRT_SOURCE: ${{ inputs.SOURCE == 'custom' && inputs.REPO || inputs.SOURCE }}
      # 插件调整
      WRT_PACKAGE: ${{inputs.PACKAGE}}
      # 仅输出配置文件
      WRT_TEST: ${{inputs.TEST || false}}
